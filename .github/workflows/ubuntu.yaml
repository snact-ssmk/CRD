name: Linux Desktop via Tailscale

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Durasi runtime dalam menit (maks 360; default 355)"
        default: "355"
      restore_mode:
        description: "Pilih mode Firefox"
        required: false
        default: "restore"
        type: choice
        options:
          - restore
          - no-restore
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: tikbot-session
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: 🔧 Memproses input
        id: cfg
        run: |
          runtime=${{ inputs.runtime_minutes }}
          if ! [[ "$runtime" =~ ^[0-9]+$ ]] || [ "$runtime" -gt 360 ] || [ "$runtime" -lt 6 ]; then
            echo "Runtime tidak valid. Menggunakan default 355 menit."
            runtime=355
          fi

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "restore_mode=${{ inputs.restore_mode || 'restore' }}" >> "$GITHUB_OUTPUT"

      - name: ♻ Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-cache-

      - name: 📥 Instal Desktop + Tailscale + Browser
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes --no-install-recommends \
            xfce4 xfce4-terminal thunar desktop-base dbus-x11 xscreensaver wget curl unzip jq \
            xvfb x11vnc net-tools

          # Chrome
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy install

          # Firefox
          sudo apt-get install -y firefox

          # Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # noVNC (untuk akses via browser)
          git clone --depth=1 https://github.com/novnc/noVNC.git /opt/noVNC
          git clone --depth=1 https://github.com/novnc/websockify /opt/noVNC/utils/websockify

      # === RESTORE PROFILE ===
      - name: 🧩 Restore Profil Firefox
        if: ${{ inputs.restore_mode == 'restore' || github.event_name == 'schedule' }}
        run: |
          set -e
          BACKUP_FILE="$HOME/ffprofile.zip"
          SNAP_COMMON="/home/runner/snap/firefox/common/.mozilla/firefox"
          SNAP_CURRENT="/home/runner/snap/firefox/current/.mozilla/firefox"
          mkdir -p "$SNAP_COMMON" "$SNAP_CURRENT"

          echo "📥 Mengunduh file backup profil..."
          wget -q -O "$BACKUP_FILE" "https://github.com/Thorns2007/super-duper-computing-machine/releases/download/ffpu/ffprofile.zip" || true
          if [ -s "$BACKUP_FILE" ]; then
            unzip -oq "$BACKUP_FILE" -d "$SNAP_COMMON"
            cp "$SNAP_COMMON/profiles.ini" "$SNAP_CURRENT/profiles.ini" || true
            cp -rT "$SNAP_COMMON/default-release" "$SNAP_CURRENT/default-release" || true
            chmod -R 777 /home/runner/snap/firefox || true
            echo "✅ Restore profil selesai."
          else
            echo "⚠️ File backup tidak ditemukan, skip restore."
          fi

      # === KONFIGURASI TAILSCALE + VNC + noVNC ===
      # Jika suatu saat ingin kembali pakai CRD, hapus komentar di bawah dan
      # comment baris Tailscale/noVNC di atas & step di bawah ini.
      #
      # - name: 🚀 Konfigurasi Chrome Remote Desktop (FALLBACK)
      #   run: |
      #     DISPLAY= /opt/google/chrome-remote-desktop/start-host \
      #       --code="$code" \
      #       --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
      #       --name="$pcname" \
      #       --pin="$pin"

      - name: 🚀 Setup Tailscale + Xvfb + x11vnc + noVNC
        id: ts
        run: |
          # Mulai Tailscale
          sudo tailscale up --auth-key="tskey-auth-k7ZmWUwNCU11CNTRL-nqoyS6SLsKY5e8JV9vkCLYk1RKWcKWLP7" --hostname="ubuntu-gh-${{ github.run_id }}"
          TS_IP=$(tailscale ip -4)
          echo "Tailscale IP: $TS_IP"

          # Setup virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # Start desktop environment
          xfce4-session &
          sleep 3

          # Start VNC server (hanya listen di localhost, aman via Tailscale)
          x11vnc -display :99 -forever -nopw -rfbport 5900 -localhost &
          sleep 1

          # Start noVNC (web proxy: VNC 5900 → Web 8080)
          /opt/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 0.0.0.0:8080 &
          sleep 1

          # Simpan IP untuk step berikutnya
          echo "ts_ip=$TS_IP" >> "$GITHUB_OUTPUT"

          # Buka terminal dengan setup-bot.sh di desktop VNC
          sleep 2
          export DISPLAY=:99
          xfce4-terminal --title="Tikbot" --hold \
            --command="bash -c 'cd $HOME/Downloads/Tikbot && while [ ! -f tikbot.log ]; do sleep 0.5; done && exec tail -f tikbot.log'" &

          echo "✅ Tailscale + VNC + noVNC siap!"
          echo "🔗 Akses via browser: http://$TS_IP:8080/vnc.html"

      # === INSTALL EXTENSIONS - RESTORE MODE ===
      - name: 🌐 Instal Extension Firefox & Chrome (Mode Restore)
        if: ${{ inputs.restore_mode == 'restore' || github.event_name == 'schedule' }}
        run: |
          echo "=== Instal Extension Firefox (Restore Mode) ==="
          PF_CURRENT=$(find /home/runner/snap/firefox/current/.mozilla/firefox -maxdepth 1 -type d -name "*.default-release" | head -n 1 || true)
          PF_COMMON="/home/runner/snap/firefox/common/.mozilla/firefox/default-release"
          FIREFOX_PROFILE_PATH="${PF_CURRENT:-$PF_COMMON}"
          mkdir -p "$FIREFOX_PROFILE_PATH/extensions"

          wget -O ~/ublock_origin.xpi "https://addons.mozilla.org/firefox/downloads/file/4578681/ublock_origin-1.66.4.xpi"
          wget -O ~/xdm_browser_monitor.xpi "https://addons.mozilla.org/firefox/downloads/file/3710348/xdm_browser_monitor-2.2.xpi"
          wget -O ~/multi_account_containers.xpi "https://addons.mozilla.org/firefox/downloads/file/4494279/multi_account_containers-8.3.0.xpi"
          wget -O ~/twitter_media_harvest.xpi "https://github.com/EltonChou/TwitterMediaHarvest/releases/download/v4.4.4/mediaharvest@mediaharvest.app-v4.4.4.xpi"

          EXT_DIR="$FIREFOX_PROFILE_PATH/extensions"
          for xpi in ~/ublock_origin.xpi ~/xdm_browser_monitor.xpi ~/multi_account_containers.xpi ~/twitter_media_harvest.xpi; do
            tmpdir=$(mktemp -d)
            unzip -qq "$xpi" -d "$tmpdir"
            id=$(jq -r '.applications.gecko.id // .browser_specific_settings.gecko.id' "$tmpdir/manifest.json")
            [ -n "$id" ] && cp "$xpi" "$EXT_DIR/$id.xpi"
          done
          echo "✅ Ekstensi Firefox mode restore terpasang."

      # === INSTALL EXTENSIONS - NO RESTORE MODE ===
      - name: 🌐 Instal Extension Firefox & Chrome (Mode No-Restore)
        if: ${{ inputs.restore_mode == 'no-restore' }}
        run: |
          echo "=== Instal Extension Firefox (No-Restore Mode) ==="
          sudo apt-get install -y jq unzip

          FIREFOX_PROFILE_NAME="default-release"
          FIREFOX_PROFILE_PATH="$HOME/.mozilla/firefox/${FIREFOX_PROFILE_NAME}"
          mkdir -p "$FIREFOX_PROFILE_PATH"

          cat <<EOF > "$HOME/.mozilla/firefox/profiles.ini"
          [General]
          StartWithLastProfile=1
          [Profile0]
          Name=$FIREFOX_PROFILE_NAME
          IsRelative=1
          Path=${FIREFOX_PROFILE_NAME}
          Default=1
          EOF

          wget -O ~/ublock_origin.xpi "https://addons.mozilla.org/firefox/downloads/file/4578681/ublock_origin-1.66.4.xpi"
          wget -O ~/xdm_browser_monitor.xpi "https://addons.mozilla.org/firefox/downloads/file/3710348/xdm_browser_monitor-2.2.xpi"
          wget -O ~/multi_account_containers.xpi "https://addons.mozilla.org/firefox/downloads/file/4494279/multi_account_containers-8.3.0.xpi"
          wget -O ~/twitter_media_harvest.xpi "https://github.com/EltonChou/TwitterMediaHarvest/releases/download/v4.4.4/mediaharvest@mediaharvest.app-v4.4.4.xpi"

          EXT_DIR="$FIREFOX_PROFILE_PATH/extensions"
          mkdir -p "$EXT_DIR"

          for xpi in ~/ublock_origin.xpi ~/xdm_browser_monitor.xpi ~/multi_account_containers.xpi ~/twitter_media_harvest.xpi; do
            tmpdir=$(mktemp -d)
            unzip -qq "$xpi" -d "$tmpdir"
            id=$(jq -r '.applications.gecko.id // .browser_specific_settings.gecko.id' "$tmpdir/manifest.json")
            [ -n "$id" ] && cp "$xpi" "$EXT_DIR/$id.xpi"
          done

          cat <<EOF > "$FIREFOX_PROFILE_PATH/prefs.js"
          user_pref("xpinstall.signatures.required", false);
          user_pref("extensions.autoDisableScopes", 0);
          user_pref("extensions.enabledScopes", 15);
          user_pref("browser.startup.homepage", "https://www.google.com/");
          EOF

          echo "✅ Semua ekstensi Firefox (No-Restore) aktif."
          echo "=== Instal Extension Chrome ==="
          mkdir -p ~/.config/google-chrome/Default
          sudo mkdir -p /etc/opt/chrome/policies/managed
          cat <<EOF | sudo tee /etc/opt/chrome/policies/managed/extensions.json
          {
            "ExtensionInstallForcelist": [
              "ddkjiahejlhfcafbddmgiahcphecmpfh;https://clients2.google.com/service/update2/crx",
              "jonfefokggbliacanjbaiejmbclccocp;https://clients2.google.com/service/update2/crx"
            ]
          }
          EOF

      - name: 📥 Download & Setup Tikbot
        run: |
          mkdir -p "$HOME/Downloads"
          OUT="$HOME/Downloads/Tikbot.zip"
          wget -q -O "$OUT" "https://github.com/Thorns2007/super-duper-computing-machine/releases/download/tb/Tikbot.zip"
          [ -s "$OUT" ] && echo "✅ Tikbot.zip berhasil diunduh"
          cd "$HOME/Downloads"
          unzip -oq "Tikbot.zip"
          chmod +x "$HOME/Downloads/Tikbot/setup-bot.sh"
          sed -i 's/\r$//' "$HOME/Downloads/Tikbot/setup-bot.sh"
          cd "$HOME/Downloads/Tikbot"
          sed -i 's/^set -e/#set -e/' setup-bot.sh
          stdbuf -oL -eL bash setup-bot.sh > tikbot.log 2>&1 &
          echo $! > tikbot.pid
          echo "✅ Tikbot berjalan (PID: $(cat tikbot.pid))"

      - name: ⏳ Menjaga sesi tetap aktif
        run: |
          runtime_mins="${{ steps.cfg.outputs.runtime }}"
          ts_ip="${{ steps.ts.outputs.ts_ip }}"
          end_time=$((SECONDS + runtime_mins * 60))

          echo "============================================"
          echo "✅ Sesi Desktop via Tailscale sudah siap!"
          echo "🌐 Browser: http://${ts_ip}:8080/vnc.html"
          echo "📡 VNC:     ${ts_ip}:5900"
          echo "🔑 SSH:     ssh runner@${ts_ip}"
          echo "============================================"

          while [ $SECONDS -lt $end_time ]; do
            remaining=$(( (end_time - SECONDS) / 60 ))
            echo "⏳ Sesi aktif, sisa $remaining menit | IP: $ts_ip | Browser: http://${ts_ip}:8080/vnc.html"
            sleep 60
          done
          echo "✅ Sesi selesai."
